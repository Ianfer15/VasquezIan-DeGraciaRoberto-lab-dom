<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción a cursos - UTP</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Inscripción a cursos</h1>
        <p class="intro">Facultad de Ingeniería de Sistemas Computacionales</p>

        <form id="inscripcion" novalidate>
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" autocomplete="name"
                    aria-describedby="nombre-error">
                <p id="nombre-error" class="error" aria-live="polite"></p>
            </div>

            <div class="campo">
                <label for="cedula">Cédula</label>
                <input id="cedula" name="cedula" type="text"
                    placeholder="8-123-4567" aria-describedby="cedula-error">
                <p id="cedula-error" class="error" aria-live="polite"></p>
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input id="correo" name="correo" type="email" autocomplete="email"
                    placeholder="nombre@dominio.com" aria-describedby="correo-error">
                <p id="correo-error" class="error" aria-live="polite"></p>
            </div>

            <div class="campo">
                <label for="celular">Celular</label>
                <input id="celular" name="celular" type="tel"
                    placeholder="6123-4567" aria-describedby="celular-error">
                <p id="celular-error" class="error" aria-live="polite"></p>
            </div>

            <div class="campo">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input id="fechaNacimiento" name="fechaNacimiento" type="date"
                    aria-describedby="fechaNacimiento-error">
                <p id="fechaNacimiento-error" class="error" aria-live="polite"></p>
            </div>

            <div class="campo">
                <label for="curso">Curso</label>
                <select id="curso" name="curso" aria-describedby="curso-error">
                    <option value="">Selecciona un curso</option>
                    <option value="Programación Web">Programación Web</option>
                    <option value="Bases de Datos">Bases de Datos</option>
                    <option value="Ingeniería de Software">Ingeniería de Software</option>
                    <option value="Redes de Computadoras">Redes de Computadoras</option>
                </select>
                <p id="curso-error" class="error" aria-live="polite"></p>
            </div>

            <fieldset>
                <legend>Modalidad</legend>
                <label>
                    <input type="radio" name="modalidad" value="presencial">
                    Presencial
                </label>
                <label>
                    <input type="radio" name="modalidad" value="virtual">
                    Virtual
                </label>
                <p id="modalidad-error" class="error" aria-live="polite"></p>
            </fieldset>

            <div class="campo" id="campo-sede" hidden>
                <label for="sede">Sede</label>
                <select id="sede" name="sede" aria-describedby="sede-error">
                    <option value="">Selecciona una sede</option>
                    <option value="Ciudad de Panamá">Ciudad de Panamá</option>
                    <option value="David">David</option>
                    <option value="Santiago">Santiago</option>
                </select>
                <p id="sede-error" class="error" aria-live="polite"></p>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input id="contrasena" name="contrasena" type="password"
                    aria-describedby="contrasena-error">
                <p id="contrasena-error" class="error" aria-live="polite"></p>
                <p id="fuerza" class="fuerza">Fuerza: —</p>
            </div>

            <div class="campo">
                <label for="confirmarContrasena">Confirmar contraseña</label>
                <input id="confirmarContrasena" name="confirmarContrasena" type="password"
                    aria-describedby="confirmarContrasena-error">
                <p id="confirmarContrasena-error" class="error" aria-live="polite"></p>
            </div>

            <div class="campo">
                <label for="comentarios">Comentarios <span>(opcional)</span></label>
                <textarea id="comentarios" name="comentarios" maxlength="200"
                    aria-describedby="comentarios-error"></textarea>
                <p id="contador">0 / 200</p>
                <p id="comentarios-error" class="error" aria-live="polite"></p>
            </div>

            <div class="terminos">
                <label>
                    <input id="terminos" name="terminos" type="checkbox"
                        aria-describedby="terminos-error">
                    Acepto los términos.
                </label>
                <p id="terminos-error" class="error" aria-live="polite"></p>
            </div>

            <button type="submit">Inscribirme</button>
        </form>

        <section id="confirmacion" aria-live="polite"></section>
    </main>

    <script src="validacion.js" defer></script>
</body>
</html>
